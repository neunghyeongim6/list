<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>유아교육 학습공간</title>
<style>
:root{--ink:#405348;--muted:#718178;--bg:#f5f7f2;--line:#dce8da;--green:#557b5d;--shadow:0 10px 26px rgba(57,83,62,.10)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 94% 0,#fff1d5,transparent 27%),var(--bg);color:var(--ink);font-family:"Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif}header{max-width:1320px;margin:auto;padding:28px 22px 20px}h1{font-size:clamp(25px,4vw,37px);letter-spacing:-1px;margin:0}header p{font-size:14px;color:var(--muted);margin:8px 0 0}.pen{border:0;border-radius:50%;background:#eaf3e7;color:#52735a;width:29px;height:29px;cursor:pointer;vertical-align:middle}
.app{max-width:1320px;margin:auto;padding:0 22px 46px;display:grid;grid-template-columns:255px 1fr;gap:18px}@media(max-width:820px){.app{grid-template-columns:1fr;padding:0 14px 32px}.side{position:static!important}.course-list{max-height:190px!important}}
.side{position:sticky;top:12px;align-self:start;background:rgba(255,255,255,.86);border:1px solid var(--line);border-radius:22px;padding:14px;box-shadow:var(--shadow);backdrop-filter:blur(8px)}.side-title{font-size:13px;font-weight:900;margin:7px 8px 8px}.menu{display:grid;gap:5px}.menu-btn,.course-select{border:0;background:transparent;color:var(--ink);font:inherit;text-align:left;width:100%;border-radius:13px;padding:11px;cursor:pointer}.menu-btn.active,.menu-btn:hover,.course-select.active,.course-select:hover{background:#e8f3e5;font-weight:800}.menu-btn small,.course-select small{display:block;font-size:11px;color:var(--muted);font-weight:400;margin-top:3px}.course-list{display:grid;gap:5px;max-height:43vh;overflow:auto}.course-item{display:grid;grid-template-columns:7px 1fr 28px;gap:4px;align-items:stretch}.course-dot{border-radius:9px}.course-edit{border:0;border-radius:9px;background:#edf5eb;color:#52735a;font-weight:800;cursor:pointer}hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.btn{border:0;border-radius:12px;padding:10px 13px;font:inherit;font-weight:800;cursor:pointer}.primary{background:#557b5d;color:#fff}.secondary{background:#eaf3e7;color:#486d50}.full{width:100%;margin-top:8px}
.top{background:rgba(255,255,255,.86);border:1px solid var(--line);border-radius:23px;padding:20px;box-shadow:var(--shadow);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.top h2{margin:0;font-size:22px}.top p{margin:6px 0 0;font-size:13px;color:var(--muted);line-height:1.55}.actions{display:flex;gap:7px;flex-wrap:wrap}
.board{columns:3 270px;column-gap:15px;margin-top:16px}.card{break-inside:avoid;background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;margin:0 0 15px;box-shadow:var(--shadow);border-top:5px solid var(--course)}.card.assignment{background:#fff6f0}.card h3{font-size:16px;line-height:1.45;margin:0 25px 5px 0}.meta{font-size:11px;color:var(--muted)}.card p{font-size:13px;line-height:1.65;white-space:pre-wrap;margin:10px 0}.info{font-size:12px;line-height:1.65;border-radius:10px;padding:9px 10px;margin-top:8px;background:#f3effd}.info.other{background:#eef6ed}.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}.tag{font-size:11px;padding:4px 8px;border-radius:99px;background:#e9f3e7;color:#4b6f52}.mini{border:0;border-radius:8px;padding:6px 8px;background:#edf5eb;color:#466b4e;font-size:11px;font-weight:800;cursor:pointer}.mini.del{background:#fff0eb;color:#a54d3e}.card-actions{display:flex;gap:6px;margin-top:11px}
.empty{margin-top:16px;padding:42px 16px;text-align:center;border:1px dashed #b9d1b7;border-radius:20px;background:rgba(255,255,255,.65);color:var(--muted);line-height:1.7}
.modal-bg{display:none;position:fixed;inset:0;z-index:10;background:rgba(38,55,42,.35);padding:17px;overflow:auto}.modal-bg.open{display:flex;align-items:center;justify-content:center}.modal{width:min(680px,100%);max-height:94vh;overflow:auto;background:#fffefa;border-radius:22px;padding:21px;box-shadow:0 22px 60px rgba(0,0,0,.2)}.close{float:right;border:0;border-radius:50%;width:34px;height:34px;background:#eaf3e7;color:#557b5d;font-size:22px;cursor:pointer}.modal h2{margin:0 40px 5px 0;font-size:21px}.help{font-size:12px;color:var(--muted);line-height:1.65;margin:4px 0 11px}.field{margin-top:12px}.field label{font-size:12px;font-weight:900;display:block;margin-bottom:5px}.field small{font-size:11px;color:var(--muted);line-height:1.5;display:block;margin-top:5px}input,textarea{width:100%;font:inherit;color:var(--ink);border:1px solid #cfdfcc;border-radius:10px;padding:10px;background:#fff}textarea{min-height:86px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.modal-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:17px}.hidden{display:none!important}@media(max-width:480px){.row{grid-template-columns:1fr}.modal{padding:18px}}
.paper-box{margin-top:16px;background:rgba(255,255,255,.86);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow)}.upload{border:2px dashed #9cbd98;background:linear-gradient(135deg,#f2faef,#fffdf2);border-radius:17px;padding:24px 14px;text-align:center;color:#4b704f;cursor:pointer}.upload.drag{background:#e2f1df;border-color:#5d9166}.upload b{display:block;font-size:15px;margin-bottom:6px}.upload span{display:block;font-size:12px;color:var(--muted);line-height:1.6}.upload-label{display:inline-block;margin-top:11px;border-radius:10px;background:#557b5d;color:#fff;padding:9px 12px;font-size:12px;font-weight:800}.pdf-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:17px}.pdf-tile{min-width:0}.pdf-preview{aspect-ratio:2/3;overflow:hidden;position:relative;border:1px solid #d7d5ce;border-radius:13px;background:linear-gradient(145deg,#fff9f5,#f0ece6);box-shadow:0 7px 16px rgba(57,83,62,.11)}.pdf-preview:before{content:"PDF";position:absolute;inset:0;display:grid;place-items:center;color:#bc6257;font-size:17px;font-weight:900;z-index:0}.pdf-preview object{position:relative;z-index:1;width:100%;height:100%;pointer-events:none;background:#fff}.pdf-name{font-size:13px;font-weight:900;line-height:1.45;margin:8px 0 3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.pdf-meta{font-size:11px;color:var(--muted)}.pdf-actions{display:flex;gap:6px;margin-top:7px}@media(max-width:900px){.pdf-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:620px){.pdf-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}@media(max-width:350px){.pdf-grid{grid-template-columns:1fr}}
.mind{margin-top:16px;background:rgba(255,255,255,.87);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow);overflow:hidden}.mind-head{font-size:12px;line-height:1.65;color:var(--muted);margin:5px 0 15px}.root{width:min(330px,100%);margin:0 auto 25px;text-align:center;border-radius:22px;padding:16px;background:var(--course-soft);border:2px solid var(--course);box-shadow:var(--shadow)}.root h2{margin:0 0 5px;font-size:20px}.root p{font-size:12px;color:var(--muted);line-height:1.6;margin:0}.mind-grid{position:relative;display:grid;grid-template-columns:1fr 1fr;column-gap:68px;row-gap:18px;padding:10px 0}.mind-grid:before{content:"";position:absolute;left:50%;top:-23px;bottom:0;width:3px;background:var(--course);opacity:.58;border-radius:3px}.branch{position:relative}.branch.left{grid-column:1}.branch.right{grid-column:2}.branch:after{content:"";position:absolute;top:34px;width:35px;height:3px;background:var(--course);opacity:.58}.branch.left:after{right:-35px}.branch.right:after{left:-35px}.mind-card{border:1px solid var(--line);border-top:5px solid var(--course);border-radius:17px;padding:14px;background:#fff;box-shadow:0 7px 18px rgba(57,83,62,.08)}.mind-card h3{font-size:15px;margin:0 0 5px}.summary{font-size:12px;line-height:1.7;background:#edf6ec;border-left:3px solid var(--course);border-radius:8px;padding:9px 10px;margin-top:8px}.thought{font-size:12px;line-height:1.65;background:#f5f0ff;border-radius:8px;padding:8px 9px;margin-top:8px}.connect{font-size:12px;line-height:1.55;background:#fff7d9;border-left:3px solid #d5af45;border-radius:7px;padding:8px 9px;margin-top:8px}@media(max-width:650px){.mind{padding:15px}.mind-grid{grid-template-columns:1fr;padding-left:27px;gap:14px}.mind-grid:before{left:10px;top:-20px}.branch.left,.branch.right{grid-column:1}.branch:after{left:-18px!important;right:auto!important;width:18px}}
</style>
</head>
<body>
<header><h1 id="siteTitle">🌿 유아교육 학습공간 <button class="pen" type="button" onclick="openSettings()">✎</button></h1><p id="siteSub">수업·생각·과제·논문을 과목별로 모아 나의 배움 지도로 연결합니다.</p></header>
<div class="app"><aside class="side">
 <div id="spaceTitle" class="side-title">나의 학습 공간 <button class="pen" type="button" onclick="openSettings()">✎</button></div>
 <nav class="menu">
  <button id="navNotes" class="menu-btn active" type="button" onclick="setView('notes')">✎ <span id="notesLabel">수업 내용 및 생각</span><small>날짜별 수업 기록 · 과제 메모</small></button>
  <button id="navPapers" class="menu-btn" type="button" onclick="setView('papers')">📄 <span id="papersLabel">논문</span><small>PDF 파일 보관함</small></button>
  <button id="navMap" class="menu-btn" type="button" onclick="setView('map')">🧭 <span id="mapLabel">지도</span><small>자동 요약 마인드맵</small></button>
 </nav>
 <hr><div id="courseLabel" class="side-title">과목 선택</div><div id="courseList" class="course-list"></div>
 <button class="btn primary full" type="button" onclick="openCourse()">＋ 과목 만들기</button><hr>
 <button class="btn secondary full" type="button" onclick="downloadBackup()">기록 백업</button>
 <div class="field"><label>백업 불러오기</label><input type="file" accept=".json" onchange="restoreBackup(event)"></div>
</aside>
<main><section class="top"><div><h2 id="pageTitle">수업 내용 및 생각</h2><p id="pageDesc">과목을 선택하면 기록이 날짜별로 정리됩니다.</p></div><div id="actions" class="actions"></div></section><section id="content"></section></main></div>

<div id="courseModal" class="modal-bg"><div class="modal"><button class="close" type="button" onclick="closeModal('courseModal')">×</button><h2 id="courseModalTitle">새 과목 만들기</h2><p class="help">과목마다 서로 다른 색과 독립된 논문함·지도가 만들어집니다.</p><div class="field"><label>과목명</label><input id="courseName"></div><div class="field"><label>학기</label><input id="courseTerm" placeholder="예: 2026년 2학기"></div><div class="modal-foot"><button class="btn secondary" type="button" onclick="closeModal('courseModal')">취소</button><button id="courseSave" class="btn primary" type="button" onclick="saveCourse()">만들기</button></div></div></div>

<div id="postModal" class="modal-bg"><div class="modal"><button class="close" type="button" onclick="closeModal('postModal')">×</button><h2 id="postHead"></h2><p id="postHelp" class="help"></p><input id="postType" type="hidden">
 <div class="field"><label>제목</label><input id="postTitle"></div>
 <div id="dateRow" class="row"><div id="weekField" class="field"><label>수업 주차</label><input id="postWeek" type="number" min="0"></div><div class="field"><label id="dateLabel">수업 날짜</label><input id="postDate" type="date"></div></div>
 <div class="field"><label id="contentLabel">수업 내용</label><textarea id="postContent"></textarea></div>
 <div id="beforeField" class="field"><label>나의 처음 생각 · 기존 관점</label><textarea id="postBefore"></textarea></div>
 <div id="shiftField" class="field"><label id="shiftLabel">나의 생각 변화 · 새롭게 이해한 점</label><textarea id="postShift"></textarea></div>
 <div id="nextField" class="field"><label>나의 다음 질문 · 실천</label><textarea id="postNext"></textarea></div>
 <div id="teacherField" class="field"><label>함께 수업을 들은 선생님들의 생각</label><textarea id="postTeacher"></textarea><small>수업 기록에만 저장되며 지도에는 포함되지 않습니다.</small></div>
 <div id="tagsField" class="field"><label>연결 태그</label><input id="postTags" placeholder="예: 놀이, 교사 역할, 관찰"></div>
 <div class="modal-foot"><button class="btn secondary" type="button" onclick="closeModal('postModal')">취소</button><button id="postSave" class="btn primary" type="button" onclick="savePost()">저장하기</button></div>
</div></div>

<div id="settingsModal" class="modal-bg"><div class="modal"><button class="close" type="button" onclick="closeModal('settingsModal')">×</button><h2>제목 수정</h2><p class="help">왼쪽 학습 공간의 메뉴 제목도 원하는 표현으로 바꿀 수 있습니다.</p><div class="field"><label>웹 제목</label><input id="setTitle"></div><div class="field"><label>부제목</label><textarea id="setSub"></textarea></div><div class="field"><label>나의 학습 공간</label><input id="setSpace"></div><div class="row"><div class="field"><label>수업·생각 메뉴</label><input id="setNotes"></div><div class="field"><label>논문 메뉴</label><input id="setPapers"></div></div><div class="row"><div class="field"><label>지도 메뉴</label><input id="setMap"></div><div class="field"><label>과목 목록 제목</label><input id="setCourse"></div></div><div class="modal-foot"><button class="btn secondary" type="button" onclick="closeModal('settingsModal')">취소</button><button class="btn primary" type="button" onclick="saveSettings()">저장하기</button></div></div></div>

<script>
const KEY='edu_mindmap_v4',SETKEY='edu_mindmap_settings_v4',DB='edu_pdf_files_v4',STORE='files';
const palette=[['#7967bd','#eeeafa'],['#d58a53','#fff0e5'],['#799f57','#edf7e7'],['#ce7181','#fff0f2'],['#4d92b5','#e8f5fb'],['#b59a48','#fff8dc']];
const defaults={title:'🌿 유아교육 학습공간',sub:'수업·생각·과제·논문을 과목별로 모아 나의 배움 지도로 연결합니다.',space:'나의 학습 공간',notes:'수업 내용 및 생각',papers:'논문',map:'지도',course:'과목 선택'};
let data=JSON.parse(localStorage.getItem(KEY)||'{"courses":[],"posts":[]}'),settings=Object.assign({},defaults,JSON.parse(localStorage.getItem(SETKEY)||'{}'));
let selected=null,view='notes',editCourseId=null,editPostId=null;
const $=id=>document.getElementById(id),id=()=>Date.now()+'-'+Math.random().toString(16).slice(2),tags=s=>(s||'').split(',').map(x=>x.trim()).filter(Boolean),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const course=()=>data.courses.find(c=>c.id===selected); const color=c=>palette[(data.courses.findIndex(x=>x.id===c.id)+palette.length)%palette.length];
function db(){return new Promise((ok,no)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function put(k,f){let d=await db();return new Promise((ok,no)=>{let t=d.transaction(STORE,'readwrite');t.objectStore(STORE).put(f,k);t.oncomplete=ok;t.onerror=no})}async function get(k){let d=await db();return new Promise((ok,no)=>{let r=d.transaction(STORE).objectStore(STORE).get(k);r.onsuccess=()=>ok(r.result);r.onerror=no})}async function drop(k){let d=await db();d.transaction(STORE,'readwrite').objectStore(STORE).delete(k)}
function persist(){localStorage.setItem(KEY,JSON.stringify(data));render()}function closeModal(x){$(x).classList.remove('open')}
function applySettings(){$('siteTitle').innerHTML=`${esc(settings.title)} <button class="pen" type="button" onclick="openSettings()">✎</button>`;$('siteSub').textContent=settings.sub;$('spaceTitle').innerHTML=`${esc(settings.space)} <button class="pen" type="button" onclick="openSettings()">✎</button>`;$('notesLabel').textContent=settings.notes;$('papersLabel').textContent=settings.papers;$('mapLabel').textContent=settings.map;$('courseLabel').textContent=settings.course;document.title=settings.title}
function openSettings(){['Title','Sub','Space','Notes','Papers','Map','Course'].forEach(k=>$('set'+k).value=settings[k.toLowerCase()]);$('settingsModal').classList.add('open')}
function saveSettings(){['title','sub','space','notes','papers','map','course'].forEach(k=>settings[k]=$('set'+k[0].toUpperCase()+k.slice(1)).value.trim()||defaults[k]);localStorage.setItem(SETKEY,JSON.stringify(settings));applySettings();closeModal('settingsModal')}
function renderCourses(){$('courseList').innerHTML=data.courses.length?data.courses.map(c=>{let co=color(c);return `<div class="course-item"><i class="course-dot" style="background:${co[0]}"></i><button class="course-select ${selected===c.id?'active':''}" type="button" onclick="choose('${c.id}')">${esc(c.name)}<small>${esc(c.term||'학기 미입력')} · ${data.posts.filter(p=>p.courseId===c.id).length}개 기록</small></button><button class="course-edit" type="button" onclick="openCourse('${c.id}')">✎</button></div>`}).join(''):'<p class="help">먼저 과목을 만들어 주세요.</p>'}
function choose(x){selected=x;render()}function setView(x){view=x;render()}
function openCourse(cid=null){editCourseId=cid;let c=cid?data.courses.find(x=>x.id===cid):null;$('courseModalTitle').textContent=c?'과목 제목 수정':'새 과목 만들기';$('courseSave').textContent=c?'수정 저장':'만들기';$('courseName').value=c?.name||'';$('courseTerm').value=c?.term||'';$('courseModal').classList.add('open')}
function saveCourse(){let name=$('courseName').value.trim();if(!name)return alert('과목명을 입력해 주세요.');if(editCourseId){let c=data.courses.find(x=>x.id===editCourseId);c.name=name;c.term=$('courseTerm').value.trim()}else{let c={id:id(),name,term:$('courseTerm').value.trim()};data.courses.push(c);selected=c.id}closeModal('courseModal');persist()}
function resetPost(){['postTitle','postWeek','postContent','postBefore','postShift','postNext','postTeacher','postTags'].forEach(x=>$(x).value='');$('postDate').value=new Date().toISOString().slice(0,10)}
function openPost(type,pid=null){if(!selected)return alert('먼저 과목을 선택해 주세요.');let p=pid?data.posts.find(x=>x.id===pid):null;editPostId=p?.id||null;resetPost();let note=type==='note',assignment=type==='assignment';$('postType').value=type;$('postHead').textContent=p?(note?'수업·생각 수정':'과제 메모 수정'):(note?'수업·생각 작성':'과제 메모 작성');$('postHelp').textContent=note?'수업 내용과 나의 생각을 기록합니다. 다른 선생님들의 생각은 지도에 포함하지 않습니다.':'제목, 마감일, 과제 안내와 진행 메모만 간단히 기록합니다.';$('weekField').classList.toggle('hidden',assignment);$('dateLabel').textContent=assignment?'마감일':'수업 날짜';$('contentLabel').textContent=assignment?'과제 안내 · 요구사항 · 해야 할 일':'수업 내용';$('beforeField').classList.toggle('hidden',assignment);$('nextField').classList.toggle('hidden',assignment);$('teacherField').classList.toggle('hidden',!note);$('tagsField').classList.toggle('hidden',assignment);$('shiftLabel').textContent=assignment?'진행 메모 · 새로 찾은 방향':'나의 생각 변화 · 새롭게 이해한 점';$('postSave').textContent=p?'수정 저장':'저장하기';if(p){$('postTitle').value=p.title||'';$('postWeek').value=p.week||'';$('postDate').value=p.date||'';$('postContent').value=p.content||'';$('postBefore').value=p.before||'';$('postShift').value=p.shift||'';$('postNext').value=p.next||'';$('postTeacher').value=p.teacherThought||'';$('postTags').value=(p.tags||[]).join(', ')}$('postModal').classList.add('open')}
function savePost(){let type=$('postType').value,title=$('postTitle').value.trim();if(!title)return alert('제목을 입력해 주세요.');let fields={courseId:selected,type,title,week:+$('postWeek').value||0,date:$('postDate').value,content:$('postContent').value.trim(),before:$('postBefore').value.trim(),shift:$('postShift').value.trim(),next:$('postNext').value.trim(),teacherThought:type==='note'?$('postTeacher').value.trim():'',tags:tags($('postTags').value)};if(editPostId)Object.assign(data.posts.find(x=>x.id===editPostId),fields);else data.posts.push({id:id(),created:Date.now(),...fields});closeModal('postModal');persist()}
function tagHTML(a){return a.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}
function noteCard(p,c){return `<article class="card ${p.type}" style="--course:${color(c)[0]}"><h3>${p.type==='assignment'?'✓':'✎'} ${esc(p.title)}</h3><div class="meta">${p.type==='assignment'?'마감일 · ':p.week?p.week+'주차 · ':''}${esc(p.date||'날짜 미입력')}</div>${p.content?`<p>${esc(p.content)}</p>`:''}${p.before?`<div class="info">💭 <b>나의 처음 생각</b><br>${esc(p.before)}</div>`:''}${p.shift?`<div class="info">🌼 <b>${p.type==='assignment'?'진행 메모':'나의 생각 변화'}</b><br>${esc(p.shift)}</div>`:''}${p.teacherThought?`<div class="info other">🗣️ <b>함께 수업을 들은 선생님들의 생각</b><br>${esc(p.teacherThought)}</div>`:''}<div class="tags">${tagHTML(p.tags||[])}</div><div class="card-actions"><button class="mini" type="button" onclick="openPost('${p.type}','${p.id}')">수정</button><button class="mini del" type="button" onclick="removePost('${p.id}')">삭제</button></div></article>`}
function renderNotes(c){let a=data.posts.filter(p=>p.courseId===c.id&&p.type!=='paper').sort((a,b)=>String(b.date).localeCompare(String(a.date))||b.created-a.created);$('content').innerHTML=a.length?`<div class="board">${a.map(p=>noteCard(p,c)).join('')}</div>`:'<div class="empty">아직 수업 기록이나 과제 메모가 없습니다.</div>'}
function renderPapers(c){let a=data.posts.filter(p=>p.courseId===c.id&&p.type==='paper').sort((a,b)=>b.created-a.created);$('content').innerHTML=`<section class="paper-box"><div id="dropzone" class="upload" tabindex="0"><b>📄 PDF 논문 파일 올리기</b><span>PDF 파일을 끌어다 놓거나 아래 버튼으로 여러 파일을 선택하세요.</span><label class="upload-label" for="pdfInput">PDF 파일 선택</label><input id="pdfInput" type="file" accept="application/pdf" multiple hidden onchange="uploadPDFs(this.files);this.value=''"></div><div class="pdf-grid">${a.length?a.map(p=>`<article class="pdf-tile"><div class="pdf-preview" data-key="${esc(p.fileKey)}"></div><h3 class="pdf-name">${esc(p.title)}</h3><div class="pdf-meta">${new Date(p.created).toLocaleDateString('ko-KR')}</div><div class="pdf-actions"><button class="mini" onclick="openPDF('${p.id}')">열기</button><button class="mini del" onclick="removePost('${p.id}')">삭제</button></div></article>`).join(''):'<div class="empty" style="grid-column:1/-1;margin:0">아직 올린 PDF 논문이 없습니다.</div>'}</div></section>`;bindDrop();previewPDFs()}
function bindDrop(){let z=$('dropzone');if(!z)return;z.addEventListener('dragover',e=>{e.preventDefault();z.classList.add('drag')});z.addEventListener('dragleave',()=>z.classList.remove('drag'));z.addEventListener('drop',e=>{e.preventDefault();z.classList.remove('drag');uploadPDFs(e.dataTransfer.files)});z.addEventListener('keydown',e=>{if(e.key==='Enter')$('pdfInput').click()})}
async function uploadPDFs(list){let fs=[...list];if(!fs.length||!selected)return;if(fs.some(f=>f.type!=='application/pdf'&&!f.name.toLowerCase().endsWith('.pdf')))return alert('PDF 파일만 올릴 수 있습니다.');for(let f of fs){let p={id:id(),courseId:selected,type:'paper',title:f.name.replace(/\.pdf$/i,''),date:new Date().toISOString().slice(0,10),created:Date.now(),fileKey:'pdf-'+id(),fileName:f.name};try{await put(p.fileKey,f);data.posts.push(p)}catch(e){alert('파일 저장에 실패했습니다.')}}persist()}
async function previewPDFs(){for(let box of document.querySelectorAll('.pdf-preview[data-key]')){try{let f=await get(box.dataset.key);if(f){let u=URL.createObjectURL(f),o=document.createElement('object');o.type='application/pdf';o.data=u+'#page=1&toolbar=0&navpanes=0';box.appendChild(o)}}catch(e){}}}
async function openPDF(pid){let p=data.posts.find(x=>x.id===pid),f=await get(p.fileKey);if(!f)return alert('PDF 파일을 찾지 못했습니다.');let u=URL.createObjectURL(f);window.open(u,'_blank');setTimeout(()=>URL.revokeObjectURL(u),60000)}
async function removePost(pid){if(!confirm('이 기록을 삭제할까요?'))return;let p=data.posts.find(x=>x.id===pid);if(p.fileKey)await drop(p.fileKey);data.posts=data.posts.filter(x=>x.id!==pid);persist()}
function words(s){let stop=new Set(['그리고','하지만','그래서','수업','생각','내용','대한','것이다','있다','한다','에서','으로','하는','이번','통해']);return [...new Set((s||'').match(/[가-힣]{2,}/g)||[])].filter(x=>!stop.has(x))}
function summary(s,max=130){let a=String(s||'').replace(/\s+/g,' ').trim().split(/(?<=[.!?다요죠])\s+|[\n\r]+/).filter(Boolean);let out=(a.slice(0,2).join(' ')||'').trim();return out.length>max?out.slice(0,max).replace(/\s+\S*$/,'')+'…':out}
function similar(a,b){let A=new Set([...(a.tags||[]),...words([a.title,a.content,a.before,a.shift,a.next].join(' '))]),B=new Set([...(b.tags||[]),...words([b.title,b.content,b.before,b.shift,b.next].join(' '))]);return [...A].filter(x=>B.has(x))}
function renderMap(c){let a=data.posts.filter(p=>p.courseId===c.id&&p.type==='note').sort((x,y)=>String(x.date).localeCompare(String(y.date))||x.created-y.created);if(!a.length){$('content').innerHTML='<div class="empty">수업·생각 기록을 작성하면 이곳에서 자동 마인드맵이 만들어집니다.</div>';return}let co=color(c),prev=[];let nodes=a.map((p,i)=>{let rel=prev.map(x=>({x,common:similar(p,x)})).filter(x=>x.common.length).sort((x,y)=>y.common.length-x.common.length)[0];prev.push(p);let link=rel?`🔗 <b>${esc(rel.x.title)}</b>의 <b>${esc(rel.common.slice(0,4).join(', '))}</b>와 연결됩니다.`:i?'→ 이전 수업 흐름에서 새로운 개념으로 확장됩니다.':'🌱 첫 수업 기록에서 지도가 시작됩니다.';return `<div class="branch ${i%2?'right':'left'}"><article class="mind-card" style="--course:${co[0]}"><h3>✎ ${esc(p.title)}</h3><div class="meta">${p.week?p.week+'주차 · ':''}${esc(p.date||'')}</div>${summary(p.content)?`<div class="summary" style="--course:${co[0]}">✨ <b>자동 핵심 요약</b><br>${esc(summary(p.content))}</div>`:''}${summary(p.shift||p.before,110)?`<div class="thought">🌼 <b>생각 변화 요약</b><br>${esc(summary(p.shift||p.before,110))}</div>`:''}${summary(p.next,90)?`<div class="thought">🌿 <b>다음 질문 요약</b><br>${esc(summary(p.next,90))}</div>`:''}<div class="tags">${tagHTML(p.tags||[])}</div><div class="connect">${link}</div></article></div>`}).join('');$('content').innerHTML=`<section class="mind" style="--course:${co[0]};--course-soft:${co[1]}"><h2 style="margin:0;font-size:22px">🧭 ${esc(c.name)} 지도</h2><p class="mind-head">작성한 수업 내용과 나의 생각을 바탕으로 핵심을 자동 요약하고, 태그와 공통 개념이 비슷한 기록끼리 마인드맵으로 연결합니다. 다른 선생님들의 생각은 포함하지 않습니다.</p><div class="root"><h2>${esc(c.name)}</h2><p>${a.length}개의 수업·생각 기록이 자동 연결되어 있습니다.</p><div class="tags">${tagHTML([...new Set(a.flatMap(x=>x.tags||[]))].slice(0,6))}</div></div><div class="mind-grid">${nodes}</div></section>`}
function render(){applySettings();renderCourses();let c=course();$('navNotes').classList.toggle('active',view==='notes');$('navPapers').classList.toggle('active',view==='papers');$('navMap').classList.toggle('active',view==='map');$('pageTitle').textContent=view==='notes'?settings.notes:view==='papers'?settings.papers:settings.map;$('pageDesc').textContent=c?`${c.name} · ${view==='map'?'비슷한 수업 내용과 생각을 자동으로 연결합니다.':view==='papers'?'PDF 파일을 과목별로 보관합니다.':'날짜별로 기록을 관리합니다.'}`:'왼쪽에서 과목을 선택해 주세요.';$('actions').innerHTML=!c||view==='map'?'':view==='notes'?'<button class="btn secondary" onclick="openPost(\'assignment\')">✓ 과제 메모</button><button class="btn primary" onclick="openPost(\'note\')">✎ 수업·생각 작성</button>':'';if(!c){$('content').innerHTML='<div class="empty">과목을 만들고 선택해 주세요.</div>';return}if(view==='notes')renderNotes(c);else if(view==='papers')renderPapers(c);else renderMap(c)}
function downloadBackup(){let b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='유아교육_기록백업.json';a.click();URL.revokeObjectURL(a.href)}
function restoreBackup(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.courses)||!Array.isArray(x.posts))throw 0;data=x;selected=data.courses[0]?.id||null;persist()}catch{alert('올바른 백업 파일이 아닙니다.')}};r.readAsText(f)}
document.querySelectorAll('.modal-bg').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)closeModal(m.id)}));document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.modal-bg.open').forEach(m=>closeModal(m.id))});render();
</script></body></html>
