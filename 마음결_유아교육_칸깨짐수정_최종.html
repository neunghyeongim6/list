<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>마음결 유아교육 기록장</title>
<style>
:root{--ink:#415449;--muted:#718177;--bg:#f4f7f0;--white:#fffefd;--line:#d9e6d7;--green:#587b60;--soft:#eaf4e7;--paper:#fff9df;--peach:#fff2ec;--lav:#f3effb;--shadow:0 10px 26px rgba(65,84,73,.10)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#fff3d7,transparent 27%),var(--bg);color:var(--ink);font-family:"Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif}
header{max-width:1280px;margin:auto;padding:28px 22px 20px}h1{font-size:clamp(25px,4vw,37px);margin:0;letter-spacing:-1px}header p{margin:8px 0 0;color:var(--muted);font-size:14px}
.app{max-width:1280px;margin:auto;padding:0 22px 48px;display:grid;grid-template-columns:250px 1fr;gap:18px}@media(max-width:820px){.app{grid-template-columns:1fr;padding:0 14px 34px}.sidebar{position:static!important}.course-list{max-height:180px!important}}
.sidebar{position:sticky;top:12px;align-self:start;background:rgba(255,255,255,.86);border:1px solid var(--line);border-radius:22px;padding:14px;box-shadow:var(--shadow);backdrop-filter:blur(8px)}
.menu{display:grid;gap:6px}.menu-btn,.course-btn{border:0;background:transparent;color:var(--ink);font:inherit;text-align:left;width:100%;border-radius:13px;padding:11px;cursor:pointer}.menu-btn:hover,.menu-btn.active,.course-btn:hover,.course-btn.active{background:var(--soft);font-weight:800}.menu-btn small,.course-btn small{display:block;font-size:11px;color:var(--muted);font-weight:400;margin-top:3px}
.side-title{font-size:13px;font-weight:800;margin:7px 8px 8px}.course-list{display:grid;gap:4px;max-height:42vh;overflow:auto}hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.btn{border:0;border-radius:12px;padding:10px 13px;font:inherit;font-weight:800;cursor:pointer}.primary{background:var(--green);color:#fff}.secondary{background:var(--soft);color:#476b4e}.full{width:100%;margin-top:8px}
.top{background:rgba(255,255,255,.85);border:1px solid var(--line);border-radius:23px;padding:21px;box-shadow:var(--shadow);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.top h2{margin:0;font-size:22px}.top p{margin:6px 0 0;font-size:13px;line-height:1.55;color:var(--muted)}.quick-actions{display:flex;gap:7px;flex-wrap:wrap}
.board{columns:3 270px;column-gap:15px;margin-top:16px}.card{break-inside:avoid;background:var(--white);border:1px solid var(--line);border-radius:18px;padding:15px;margin:0 0 15px;box-shadow:var(--shadow);border-top:5px solid #91b293}.card.paper{background:var(--paper);border-top-color:#dbb94f}.card.assignment{background:var(--peach);border-top-color:#e3a78d}.card h3{font-size:16px;line-height:1.45;margin:0 28px 5px 0}.meta{font-size:11px;color:var(--muted)}.card p{font-size:13px;line-height:1.65;white-space:pre-wrap;margin:10px 0}.box{font-size:12px;line-height:1.65;border-radius:10px;padding:9px 10px;margin-top:9px}.mine{background:var(--lav)}.others{background:#eef5ed}.tagrow{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}.tag{font-size:11px;padding:4px 8px;border-radius:99px;background:#e8f2e5;color:#4e7054}.card-actions{display:flex;gap:6px;margin-top:12px}.mini{border:0;border-radius:8px;padding:6px 8px;background:#edf5eb;color:#476b4e;font-size:11px;font-weight:800;cursor:pointer}.delete{background:#fff0ec;color:#a44e3e}.empty{margin-top:16px;padding:42px 16px;text-align:center;border:1px dashed #b8d0b7;border-radius:20px;background:rgba(255,255,255,.65);color:var(--muted);line-height:1.7}
.modal-bg{display:none;position:fixed;inset:0;z-index:20;background:rgba(38,55,42,.35);padding:18px;overflow:auto}.modal-bg.open{display:flex;align-items:center;justify-content:center}.modal{width:min(690px,100%);max-height:94vh;overflow:auto;background:#fffefa;border-radius:22px;padding:22px;box-shadow:0 22px 60px rgba(0,0,0,.2)}.close-x{float:right;width:34px;height:34px;border:0;border-radius:50%;background:var(--soft);color:var(--green);font-size:22px;cursor:pointer}.modal h2{margin:0 40px 5px 0;font-size:21px}.help{font-size:12px;line-height:1.65;color:var(--muted);margin:4px 0 12px}
.field{margin-top:12px}.field label{display:block;font-size:12px;font-weight:800;margin:0 0 5px}.field small{display:block;font-size:11px;color:var(--muted);margin-top:5px;line-height:1.5}input,textarea,select{width:100%;font:inherit;color:var(--ink);border:1px solid #ceddcb;border-radius:10px;padding:10px;background:white}textarea{resize:vertical;min-height:86px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:480px){.row{grid-template-columns:1fr}.modal{padding:18px}}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.hidden{display:none!important}
.map{margin-top:16px;background:rgba(255,255,255,.86);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow)}.map .intro{background:#f7f2ff;border-radius:13px;padding:13px;font-size:13px;line-height:1.7}.timeline{position:relative;padding:20px 0 0 29px}.timeline:before{content:"";position:absolute;left:8px;top:23px;bottom:20px;width:3px;background:linear-gradient(#a5c4a1,#e5c875);border-radius:3px}.node{position:relative;padding-bottom:17px}.node:before{content:"";position:absolute;left:-27px;top:8px;width:14px;height:14px;border-radius:50%;background:#719776;box-shadow:0 0 0 5px #eaf4e7}.nodebox{border:1px solid var(--line);border-radius:14px;padding:13px;background:#fff}.nodebox h3{font-size:15px;margin:0}.connection{margin-top:9px;background:#fff7d9;border-left:3px solid #d3af48;border-radius:7px;padding:8px 9px;font-size:12px;line-height:1.6}
</style>
</head>
<body>
<header><h1>🌿 마음결 유아교육 기록장</h1><p>논문은 PDF로, 수업 내용·나의 생각·함께 들은 선생님들의 생각은 웹에서 바로 기록합니다.</p></header>
<div class="app">
<aside class="sidebar">
 <div class="side-title">나의 학습 공간</div>
 <nav class="menu">
  <button id="nav-notes" class="menu-btn active" type="button" onclick="setView('notes')">✎ 수업 내용 및 생각<small>날짜별 수업 기록 · 과제 메모</small></button>
  <button id="nav-papers" class="menu-btn" type="button" onclick="setView('papers')">📄 논문<small>과목별 PDF와 읽기 메모</small></button>
  <button id="nav-map" class="menu-btn" type="button" onclick="setView('map')">🧭 수업 지도<small>나의 생각 변화와 수업 흐름</small></button>
 </nav>
 <hr><div class="side-title">과목 선택</div><div id="courseList" class="course-list"></div>
 <button class="btn primary full" type="button" onclick="openCourseModal()">＋ 과목 만들기</button>
 <hr><button class="btn secondary full" type="button" onclick="backup()">기록 백업</button>
 <div class="field"><label>백업 불러오기</label><input type="file" accept=".json,application/json" onchange="restore(event)"></div>
</aside>
<main>
 <section class="top"><div><h2 id="pageTitle">수업 내용 및 생각</h2><p id="pageDesc">과목을 선택하면 수업 기록과 나의 생각이 날짜별로 모입니다.</p></div><div id="actions" class="quick-actions"><button class="btn secondary" type="button" onclick="openPostModal('assignment')">✓ 과제 메모</button><button class="btn primary" type="button" onclick="openPostModal('note')">✎ 수업·생각 작성</button></div></section>
 <section id="board"></section><section id="mapArea" class="hidden"></section>
</main>
</div>

<div id="courseModal" class="modal-bg" role="dialog" aria-modal="true">
 <div class="modal"><button class="close-x" type="button" onclick="closeModal('courseModal')" aria-label="닫기">×</button><h2>새 과목 만들기</h2><p class="help">과목마다 수업 기록, 논문, 과제와 수업 지도가 따로 정리됩니다.</p>
 <div class="field"><label>과목명</label><input id="courseName" placeholder="예: 유아교육과정 연구"></div>
 <div class="field"><label>학기</label><input id="courseTerm" placeholder="예: 2026년 2학기"></div>
 <div class="modal-footer"><button class="btn secondary" type="button" onclick="closeModal('courseModal')">취소</button><button class="btn primary" type="button" onclick="saveCourse()">만들기</button></div>
 </div>
</div>

<div id="postModal" class="modal-bg" role="dialog" aria-modal="true">
 <div class="modal"><button class="close-x" type="button" onclick="closeModal('postModal')" aria-label="닫기">×</button>
 <h2 id="modalTitle">수업·생각 작성</h2><p id="modalHelp" class="help"></p><input id="postType" type="hidden">
 <div class="field"><label>제목</label><input id="postTitle" placeholder="예: 놀이 중심 교육과정에 대한 토론"></div>
 <div id="dateFields" class="row">
   <div class="field"><label id="weekLabel">수업 주차</label><input id="postWeek" type="number" min="0" placeholder="예: 3"></div>
   <div class="field"><label id="dateLabel">수업 날짜</label><input id="postDate" type="date"></div>
 </div>
 <div id="fileField" class="field hidden"><label>논문 PDF 파일</label><input id="postFile" type="file" accept="application/pdf"><small>PDF 파일은 현재 브라우저에 저장됩니다. 원본 파일은 별도 보관해 주세요.</small></div>
 <div class="field"><label id="contentLabel">수업 내용</label><textarea id="postContent" placeholder="교수님 설명, 핵심 개념, 토론 내용을 기록하세요."></textarea></div>
 <div id="reflectionFields">
   <div class="field"><label id="beforeLabel">나의 처음 생각 · 기존 관점</label><textarea id="postBefore" placeholder="처음에는 어떻게 생각했나요?"></textarea></div>
   <div class="field"><label id="shiftLabel">나의 생각 변화 · 새롭게 이해한 점</label><textarea id="postShift" placeholder="수업 뒤 무엇이 달라졌나요?"></textarea></div>
   <div class="field"><label id="nextLabel">나의 다음 질문 · 실천</label><textarea id="postNext" placeholder="다음에 더 탐구하거나 실천할 점은 무엇인가요?"></textarea></div>
   <div id="teacherField" class="field"><label>함께 수업을 들은 선생님들의 생각</label><textarea id="postTeacher" placeholder="다른 선생님들이 나눈 의견, 인상 깊었던 관점, 서로 다른 해석을 기록하세요."></textarea><small>이 칸은 수업 기록 카드에만 저장됩니다. 수업 지도에는 포함되지 않습니다.</small></div>
 </div>
 <div class="field"><label>연결 태그</label><input id="postTags" placeholder="예: 놀이, 교사 역할, 관찰 (쉼표로 구분)"></div>
 <div class="modal-footer"><button class="btn secondary" type="button" onclick="closeModal('postModal')">취소</button><button class="btn primary" type="button" onclick="savePost()">저장하기</button></div>
 </div>
</div>

<script>
const DATA_KEY='maeumgyeol_clean_v1', FILE_DB='maeumgyeol_clean_files', FILE_STORE='pdfs';
let state=JSON.parse(localStorage.getItem(DATA_KEY)||'{"courses":[],"posts":[]}');
let selectedCourseId=null, view='notes';

const el=(id)=>document.getElementById(id);
const newId=()=>`${Date.now()}-${Math.random().toString(16).slice(2)}`;
const escapeHTML=(value)=>String(value||'').replace(/[&<>"']/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tagArray=(value)=>(value||'').split(',').map(x=>x.trim()).filter(Boolean);
const currentCourse=()=>state.courses.find(c=>c.id===selectedCourseId);

function openFileDB(){
 return new Promise((resolve,reject)=>{
  const request=indexedDB.open(FILE_DB,1);
  request.onupgradeneeded=()=>request.result.createObjectStore(FILE_STORE);
  request.onsuccess=()=>resolve(request.result); request.onerror=()=>reject(request.error);
 });
}
async function storePDF(key,file){const db=await openFileDB();return new Promise((resolve,reject)=>{const tx=db.transaction(FILE_STORE,'readwrite');tx.objectStore(FILE_STORE).put(file,key);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});}
async function readPDF(key){const db=await openFileDB();return new Promise((resolve,reject)=>{const r=db.transaction(FILE_STORE).objectStore(FILE_STORE).get(key);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}
async function deletePDF(key){const db=await openFileDB();db.transaction(FILE_STORE,'readwrite').objectStore(FILE_STORE).delete(key);}

function persist(){localStorage.setItem(DATA_KEY,JSON.stringify(state));render();}
function renderCourses(){
 el('courseList').innerHTML=state.courses.length?state.courses.map(c=>`<button class="course-btn ${c.id===selectedCourseId?'active':''}" type="button" onclick="selectCourse('${c.id}')">${escapeHTML(c.name)}<small>${escapeHTML(c.term||'학기 미입력')} · ${state.posts.filter(p=>p.courseId===c.id).length}개 기록</small></button>`).join(''):'<p class="help">먼저 과목을 만들어 주세요.</p>';
}
function selectCourse(id){selectedCourseId=id;render();}
function setView(nextView){view=nextView;render();}
function openCourseModal(){el('courseModal').classList.add('open');el('courseName').focus();}
function closeModal(id){el(id).classList.remove('open');}
function saveCourse(){
 const name=el('courseName').value.trim(); if(!name){alert('과목명을 입력해 주세요.');return;}
 const course={id:newId(),name,term:el('courseTerm').value.trim()};state.courses.push(course);selectedCourseId=course.id;
 el('courseName').value='';el('courseTerm').value='';closeModal('courseModal');persist();
}
function clearPostForm(){
 ['postTitle','postWeek','postContent','postBefore','postShift','postNext','postTeacher','postTags'].forEach(id=>el(id).value='');
 el('postFile').value='';el('postDate').value=new Date().toISOString().slice(0,10);
}
function openPostModal(type){
 if(!selectedCourseId){alert('먼저 왼쪽에서 과목을 만들거나 선택해 주세요.');return;}
 clearPostForm();el('postType').value=type;
 const isNote=type==='note', isPaper=type==='paper', isAssignment=type==='assignment';
 el('modalTitle').textContent=isNote?'수업 내용 및 생각 작성':isPaper?'논문 PDF 추가':'과제 메모 작성';
 el('modalHelp').textContent=isNote?'수업 내용과 나의 생각을 날짜별로 기록합니다. 다른 선생님들의 생각은 별도 칸에 작성되며 수업 지도에는 들어가지 않습니다.':isPaper?'논문은 PDF 파일을 올리고, 읽기 메모와 나의 관점을 남깁니다.':'과제 요구사항, 진행 과정, 다음 할 일을 정리합니다.';
 el('dateFields').classList.toggle('hidden',isPaper);el('fileField').classList.toggle('hidden',!isPaper);el('teacherField').classList.toggle('hidden',!isNote);
 el('weekLabel').textContent=isAssignment?'진행 단계':'수업 주차';el('dateLabel').textContent=isAssignment?'마감일':'수업 날짜';
 el('contentLabel').textContent=isNote?'수업 내용':isPaper?'논문 핵심 · 인용 · 수업과의 연결':'과제 안내 · 요구사항 · 해야 할 일';
 el('beforeLabel').textContent=isAssignment?'과제를 처음 받았을 때의 생각':'나의 처음 생각 · 기존 관점';
 el('shiftLabel').textContent=isAssignment?'진행 메모 · 새로 찾은 방향':'나의 생각 변화 · 새롭게 이해한 점';
 el('nextLabel').textContent=isAssignment?'다음 할 일 · 제출 전 확인':'나의 다음 질문 · 실천';
 el('postModal').classList.add('open');el('postTitle').focus();
}
async function savePost(){
 const type=el('postType').value,title=el('postTitle').value.trim(),file=el('postFile').files[0];
 if(!title){alert('제목을 입력해 주세요.');return;}
 if(type==='paper'&&!file){alert('논문 PDF 파일을 선택해 주세요.');return;}
 if(file&&file.type!=='application/pdf'){alert('PDF 파일만 올릴 수 있습니다.');return;}
 const post={id:newId(),courseId:selectedCourseId,type,title,week:Number(el('postWeek').value)||0,date:el('postDate').value,content:el('postContent').value.trim(),before:el('postBefore').value.trim(),shift:el('postShift').value.trim(),next:el('postNext').value.trim(),teacherThought:type==='note'?el('postTeacher').value.trim():'',tags:tagArray(el('postTags').value),created:Date.now()};
 if(file){post.fileKey='pdf-'+post.id;post.fileName=file.name;try{await storePDF(post.fileKey,file);}catch(error){alert('PDF 저장에 실패했습니다. 브라우저 저장 공간을 확인해 주세요.');return;}}
 state.posts.push(post);closeModal('postModal');persist();
}
function tagsHTML(tags){return tags.map(t=>`<span class="tag">${escapeHTML(t)}</span>`).join('');}
function cardHTML(p){
 const icon=p.type==='paper'?'📄':p.type==='assignment'?'✓':'✎';
 const meta=p.type==='paper'?`논문 PDF · ${escapeHTML(p.fileName||'')}`:p.type==='assignment'?`과제 마감일 · ${escapeHTML(p.date||'미입력')}`:`${p.week?p.week+'주차 · ':''}${escapeHTML(p.date||'날짜 미입력')}`;
 return `<article class="card ${p.type}"><h3>${icon} ${escapeHTML(p.title)}</h3><div class="meta">${meta}</div>
 ${p.content?`<p>${escapeHTML(p.content)}</p>`:''}
 ${p.before?`<div class="box mine">💭 <b>${p.type==='assignment'?'처음 생각':'나의 처음 생각'}</b><br>${escapeHTML(p.before)}</div>`:''}
 ${p.shift?`<div class="box mine">🌼 <b>${p.type==='assignment'?'진행 메모':'나의 생각 변화'}</b><br>${escapeHTML(p.shift)}</div>`:''}
 ${p.teacherThought?`<div class="box others">🗣️ <b>함께 수업을 들은 선생님들의 생각</b><br>${escapeHTML(p.teacherThought)}</div>`:''}
 <div class="tagrow">${tagsHTML(p.tags)}</div><div class="card-actions">${p.fileKey?`<button class="mini" type="button" onclick="openPDF('${p.id}')">PDF 열기</button>`:''}<button class="mini delete" type="button" onclick="removePost('${p.id}')">삭제</button></div></article>`;
}
function renderBoard(){
 const course=currentCourse();
 el('actions').classList.toggle('hidden',!course||view==='map');
 if(!course){el('board').innerHTML='<div class="empty">🌱 왼쪽에서 과목을 만든 뒤<br>수업 기록을 시작해 보세요.</div>';return;}
 let posts=state.posts.filter(p=>p.courseId===course.id && (view==='papers'?p.type==='paper':p.type!=='paper'));
 posts.sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))||b.created-a.created);
 el('board').innerHTML=posts.length?`<div class="board">${posts.map(cardHTML).join('')}</div>`:`<div class="empty">${view==='papers'?'아직 저장한 논문 PDF가 없습니다.':'아직 수업 내용·생각 또는 과제 메모가 없습니다.'}<br>오른쪽 위 버튼으로 첫 기록을 남겨 보세요.</div>`;
}
function sharedTags(a,b){return a.filter(t=>b.includes(t));}
function renderMap(){
 const course=currentCourse();if(!course){el('mapArea').innerHTML='<div class="empty">수업 지도를 볼 과목을 선택해 주세요.</div>';return;}
 const posts=state.posts.filter(p=>p.courseId===course.id).sort((a,b)=>(a.week||9999)-(b.week||9999)||String(a.date||'').localeCompare(String(b.date||''))||a.created-b.created);
 if(!posts.length){el('mapArea').innerHTML='<div class="empty">이 과목에 기록이 아직 없습니다.</div>';return;}
 const first=posts.find(p=>p.before)?.before||'처음 생각을 기록하면 이곳에 출발점이 표시됩니다.';
 const latest=posts.filter(p=>p.shift).at(-1)?.shift||'생각의 변화를 기록하면 이곳에 현재 관점이 표시됩니다.';
 let previous=null;
 el('mapArea').innerHTML=`<div class="map"><h2 style="margin:0;font-size:21px">나의 생각이 흘러간 길</h2><p class="help">다른 선생님들의 생각은 이 지도에 포함하지 않습니다.</p><div class="intro">🌱 <b>생각의 흐름 요약</b><br>처음에는 “${escapeHTML(first)}”라고 생각했고, 지금은 “${escapeHTML(latest)}”라는 관점으로 확장되고 있습니다.</div><div class="timeline">${posts.map(p=>{const common=previous?sharedTags(p.tags,previous.tags):[];previous=p;return `<div class="node"><div class="nodebox"><h3>${p.type==='paper'?'📄 논문':p.type==='assignment'?'✓ 과제':'✎ 수업'} · ${escapeHTML(p.title)}</h3><div class="meta">${p.date?escapeHTML(p.date):'날짜 미입력'}</div>${p.content?`<p style="font-size:13px;line-height:1.6;white-space:pre-wrap">${escapeHTML(p.content)}</p>`:''}${p.before?`<div class="box mine">💭 <b>나의 처음 생각</b><br>${escapeHTML(p.before)}</div>`:''}${p.shift?`<div class="box mine">🌼 <b>나의 생각 변화</b><br>${escapeHTML(p.shift)}</div>`:''}${p.next?`<div class="box mine">🌿 <b>다음 질문 · 실천</b><br>${escapeHTML(p.next)}</div>`:''}<div class="tagrow">${tagsHTML(p.tags)}</div>${common.length?`<div class="connection">🔗 바로 앞 기록의 <b>${escapeHTML(common.join(', '))}</b> 개념과 연결됩니다.</div>`:''}</div></div>`}).join('')}</div></div>`;
}
function render(){
 renderCourses();
 el('nav-notes').classList.toggle('active',view==='notes');el('nav-papers').classList.toggle('active',view==='papers');el('nav-map').classList.toggle('active',view==='map');
 const course=currentCourse();
 el('pageTitle').textContent=view==='notes'?'수업 내용 및 생각':view==='papers'?'논문':'수업 지도';
 el('pageDesc').textContent=course?`${course.name} · ${view==='notes'?'수업 기록은 날짜별로 정렬됩니다.':view==='papers'?'논문 PDF와 읽기 메모를 모아봅니다.':'나의 생각 변화만 따라가며 수업 흐름을 정리합니다.'}`:'왼쪽에서 과목을 선택해 주세요.';
 el('mapArea').classList.toggle('hidden',view!=='map');el('board').classList.toggle('hidden',view==='map');
 if(view==='map')renderMap();else renderBoard();
}
async function openPDF(id){const p=state.posts.find(x=>x.id===id),file=await readPDF(p.fileKey);if(!file){alert('PDF를 찾지 못했습니다. 원본을 다시 등록해 주세요.');return;}const url=URL.createObjectURL(file);window.open(url,'_blank');setTimeout(()=>URL.revokeObjectURL(url),60000);}
async function removePost(id){if(!confirm('이 기록을 삭제할까요?'))return;const p=state.posts.find(x=>x.id===id);if(p?.fileKey)await deletePDF(p.fileKey);state.posts=state.posts.filter(x=>x.id!==id);persist();}
function backup(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='마음결_유아교육_기록백업.json';a.click();URL.revokeObjectURL(a.href);alert('텍스트 기록 백업을 저장했습니다. PDF 원본은 별도로 보관해 주세요.');}
function restore(event){const file=event.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const loaded=JSON.parse(reader.result);if(!Array.isArray(loaded.courses)||!Array.isArray(loaded.posts))throw new Error();state=loaded;selectedCourseId=state.courses[0]?.id||null;persist();alert('텍스트 기록을 복원했습니다. PDF 파일은 별도로 다시 올려야 합니다.');}catch{alert('올바른 백업 파일이 아닙니다.');}};reader.readAsText(file);}
document.querySelectorAll('.modal-bg').forEach(modal=>modal.addEventListener('click',event=>{if(event.target===modal)closeModal(modal.id);}));
document.addEventListener('keydown',event=>{if(event.key==='Escape')document.querySelectorAll('.modal-bg.open').forEach(modal=>closeModal(modal.id));});
render();
</script>
</body>
</html>
